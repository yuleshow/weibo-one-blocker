<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weibo One-Click Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>微博一键拉黑</h1>
    <p class="hint">请先登录 weibo.com，输入用户名或 UID（每行一个）</p>

    <div class="status-bar" id="statusBar">
      <span id="statusText">就绪</span>
    </div>

    <textarea id="uidList" placeholder="输入用户名或 UID，每行一个，例如：&#10;王虎的舰桥&#10;1234567890&#10;https://weibo.com/u/1234567890"></textarea>

    <div class="actions">
      <button id="loadListBtn" class="btn btn-primary">📋 加载黑名单</button>
      <button id="blockBtn" class="btn btn-danger">🚫 一键拉黑</button>
      <button id="clearBtn" class="btn btn-secondary">清空</button>
    </div>

    <div class="options">
      <label>
        <span>请求间隔（毫秒）：</span>
        <input type="number" id="delay" value="1000" min="500" max="10000" step="100">
      </label>
    </div>

    <div id="resultArea" class="result-area" style="display:none;">
      <h3>执行结果</h3>
      <div id="resultList"></div>
    </div>

    <div class="footer">
      <p>⚠️ 请合理使用，避免频繁操作导致账号受限</p>
      <div class="footer-links">
        <a href="https://github.com/yuleshow/weibo-one-blocker" target="_blank">GitHub</a>
        <span>·</span>
        <a href="#" id="aboutLink">关于</a>
        <span>·</span>
        <button id="reloadBtn" class="btn-link">🔄 重载插件</button>
      </div>
    </div>

    <div id="aboutModal" class="modal" style="display:none;">
      <div class="modal-content">
        <img src="icons/about.png" alt="微博一键拉黑" class="about-logo">
        <h3>微博一键拉黑</h3>
        <p>版本：v1.1.0</p>
        <p>批量拉黑微博用户的浏览器扩展，支持用户名、UID 和链接输入。</p>
        <p>黑名单自动从 GitHub 同步，每小时更新一次。</p>
        <hr>
        <p class="author-row"><img src="icons/yuleshow.png" alt="yuleshow" class="author-avatar">作者：<a href="https://github.com/yuleshow" target="_blank">yuleshow</a></p>
        <p>源码：<a href="https://github.com/yuleshow/weibo-one-blocker" target="_blank">GitHub</a></p>
        <p>协议：MIT</p>
        <button id="closeAbout" class="btn btn-secondary" style="margin-top:10px;">关闭</button>
      </div>
    </div>
  </div>

  <script src="blocklist.js"></script>
  <script src="popup.js"></script>
</body>
</html>
